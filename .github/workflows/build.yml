name: Windows build
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
jobs:
  msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*.cpp
            /*.h
            /*.txt
            /*.wav
            /CMakeLists.txt
      - name: Configure MSVC x64
        run: cmake -S . -B build -A x64
      - name: Compile and stage runtime resources
        run: cmake --build build --config Release
      - name: Verify executable and runtime files
        shell: pwsh
        run: |
          $required = @('pvz.exe', 'bgm.wav', 'menu.txt', 'fengmian.txt', 'declaration.txt', 'Conversation content.txt')
          foreach ($file in $required) {
            if (-not (Test-Path "build/Release/$file")) { throw "Missing runtime file: $file" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: pvz-windows-x64
          path: build/Release/
          retention-days: 7
